[package]
name = "fusion-pcu-cpu"
description = "Opt-in CPU execution backend for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "cpu.rs"

[features]
default = []
std = []
tensor = ["fusion-pcu-core/tensor"]
source-tensor = ["std", "tensor", "pcu-facade/cpu", "pcu-facade/tensor"]
source-div-rem = ["std", "pcu-facade/cpu"]
source-low-precision = ["std", "pcu-facade/cpu"]
source-unary = ["std", "pcu-facade/cpu"]
source-wide = ["std", "pcu-facade/cpu"]
source-portable = ["std", "pcu-facade/cpu"]
source-clamp = ["std", "pcu-facade/cpu"]
source-composed = ["std", "pcu-facade/cpu"]
source-transport = ["std", "pcu-facade/cpu"]

[[test]]
name = "ordered_transport"
path = "tests/ordered_transport/ordered_transport.rs"
required-features = ["source-transport"]

[[bench]]
name = "ordered_transport"
path = "benches/ordered_transport/ordered_transport.rs"
harness = false
required-features = ["source-transport"]

