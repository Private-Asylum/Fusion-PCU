[package]
name = "fusion-pcu-spirv"
description = "SPIR-V lowering backend for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "spirv.rs"

[dependencies]
fusion-pcu-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Test-only path dependencies stay out of the published dependency graph.
fusion-pcu-macros = { path = "../../macros" }

[[test]]
name = "checked_float_rejection"
path = "tests/checked_float_rejection/checked_float_rejection.rs"

[[test]]
name = "bit_map"
path = "tests/bit_map/bit_map.rs"
