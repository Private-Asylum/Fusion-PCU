[package]
name = "fusion-pcu-metal"
description = "Bounded checked Metal runtime for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "metal.rs"

[features]
default = []
allocation-census = []

[dependencies]
fusion-pcu-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
pcu-facade = { workspace = true, features = ["std", "metal"] }

[[test]]
name = "source"
path = "tests/source/source.rs"

[[bench]]
name = "checked_neg"
path = "benches/checked_neg/checked_neg.rs"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
