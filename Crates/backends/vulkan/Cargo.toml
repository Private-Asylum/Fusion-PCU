[package]
name = "fusion-pcu-vulkan"
description = "Explicit synchronous Vulkan SPIR-V compute execution for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "vulkan.rs"

[features]
default = ["embedded-composed"]
embedded-composed = ["fusion-pcu-spirv?/embedded-composed"]
hosted = ["dep:ash", "dep:fusion-pcu-spirv"]
tensor = ["hosted", "fusion-pcu-core/tensor"]
insights = ["fusion-pcu-core/insights"]

[dependencies]
fusion-pcu-core.workspace = true
fusion-pcu-spirv = { workspace = true, optional = true }
ash = { workspace = true, optional = true }

[lints]
workspace = true

[[test]]
name = "composed_float_maps"
path = "tests/composed_float_maps/composed_float_maps.rs"
required-features = ["hosted"]

[[test]]
name = "resident_div_rem_roles"
path = "tests/resident_div_rem_roles/resident_div_rem_roles.rs"
required-features = ["tensor"]

[[bench]]
name = "resident_div_rem_roles"
path = "benches/resident_div_rem_roles/resident_div_rem_roles.rs"
harness = false
required-features = ["tensor"]

[[example]]
name = "resident-div-rem-roles"
path = "examples/resident_div_rem_roles/resident_div_rem_roles.rs"
required-features = ["tensor"]

[dev-dependencies]
# Test-only path dependencies stay out of the published dependency graph.
fusion-pcu-macros = { path = "../../macros" }
pcu-facade = { workspace = true, features = ["vulkan", "tensor", "cpu"] }
criterion.workspace = true
winit.workspace = true

