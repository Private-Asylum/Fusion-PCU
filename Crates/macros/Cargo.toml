[package]
name = "fusion-pcu-macros"
description = "Bounded Rust kernel frontend for Fusion PCU dispatch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
proc-macro = true
path = "fusion-pcu-macros.rs"

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "visit-mut"] }

[dev-dependencies]
pcu_alias.workspace = true
# Test-only path dependencies stay out of the published dependency graph.
fusion-pcu-rocm = { path = "../backends/rocm", default-features = false }
fusion-pcu-cpu = { path = "../backends/cpu" }
fusion-pcu-spirv = { path = "../backends/spirv", default-features = false }
trybuild.workspace = true

[lints]
workspace = true
