[package]
name = "fusion-pcu"
description = "Backend-neutral facade and optional provider selection for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
autoexamples = false

[lib]
crate-type = ["rlib"]
path = "fusion-pcu.rs"

[features]
default = []
insights = ["fusion-pcu-core/insights"]
std = ["fusion-pcu-core/std"]
hosted = ["std"]
tensor = ["fusion-pcu-core/tensor", "fusion-pcu-rocm?/tensor", "fusion-pcu-cuda?/tensor", "fusion-pcu-cpu?/tensor", "fusion-pcu-vulkan?/tensor", "fusion-pcu-metal?/tensor"]
vm-reference = ["fusion-pcu-core/vm-reference"]
cpu = ["std", "dep:fusion-pcu-cpu", "fusion-pcu-cpu/std"]
cpu-benchmark-control = ["cpu"]
rocm = ["std", "dep:fusion-pcu-rocm"]
cuda = ["std", "dep:fusion-pcu-cuda"]
mlx-benchmark-control = ["mlx", "fusion-pcu-mlx/benchmark-control"]
mlx-view-census = ["mlx-benchmark-control", "fusion-pcu-mlx/view-census"]
mlx = ["std", "tensor", "dep:fusion-pcu-mlx", "fusion-pcu-mlx/tensor"]
metal = ["std", "dep:fusion-pcu-metal"]
vulkan = ["std", "dep:fusion-pcu-vulkan", "fusion-pcu-vulkan/hosted"]

[dependencies]
fusion-pcu-cpu = { workspace = true, optional = true, default-features = false }
fusion-pcu-core.workspace = true
fusion-pcu-macros.workspace = true
fusion-pcu-rocm = { workspace = true, optional = true }
fusion-pcu-cuda = { workspace = true, optional = true }
fusion-pcu-mlx = { workspace = true, optional = true }
fusion-pcu-metal = { workspace = true, optional = true }
fusion-pcu-vulkan = { workspace = true, optional = true }
smallvec.workspace = true

[lints]
workspace = true

[[test]]
name = "metal"
path = "tests/metal/metal.rs"
required-features = ["metal"]

[[example]]
name = "scalar-composition"
path = "examples/scalar-composition/scalar-composition.rs"
required-features = ["rocm"]

[[example]]
name = "owned-tensor-borrows"
path = "examples/owned-tensor-borrows/owned-tensor-borrows.rs"
required-features = ["rocm", "tensor"]

[[example]]
name = "cuda-transform"
path = "examples/cuda_transform/cuda_transform.rs"
required-features = ["cuda"]

[[example]]
name = "cpu-transform"
path = "examples/cpu-transform/cpu-transform.rs"
required-features = ["cpu"]

[[example]]
name = "scalar-program"
path = "examples/scalar-program/scalar-program.rs"
required-features = ["cpu"]

[[example]]
name = "scalar-transport"
path = "examples/scalar-transport/scalar-transport.rs"
required-features = ["cpu"]

[[example]]
name = "vulkan-transform"
path = "examples/vulkan-transform/vulkan-transform.rs"
required-features = ["vulkan"]

[[example]]
name = "owned-tensor-composition"
path = "examples/owned-tensor-composition/owned-tensor-composition.rs"
required-features = ["rocm", "tensor"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "cpu_source"
path = "benches/cpu_source/cpu_source.rs"
harness = false
required-features = ["cpu"]

[[example]]
name = "checked-arithmetic"
path = "examples/checked-arithmetic/checked-arithmetic.rs"
required-features = ["cpu"]

[[example]]
name = "checked-training"
path = "examples/checked-training/checked-training.rs"
required-features = ["tensor"]

[[example]]
name = "portable-arithmetic"
path = "examples/portable-arithmetic/portable-arithmetic.rs"
required-features = ["cpu"]

[[test]]
name = "mlx_opaque"
path = "tests/opaque/mlx.rs"
required-features = ["mlx"]

[[example]]
name = "mlx-matmul"
path = "examples/mlx-matmul/mlx-matmul.rs"
required-features = ["mlx"]

[[example]]
name = "mlx-resident"
path = "examples/mlx-resident/mlx-resident.rs"
required-features = ["mlx"]

[[bench]]
name = "mlx_source"
path = "benches/mlx_source/mlx_source.rs"
harness = false
required-features = ["mlx-benchmark-control"]

[[test]]
name = "invocation_numerical"
path = "tests/invocation_numerical/invocation_numerical.rs"
required-features = ["cpu"]

[[test]]
name = "scalar_locals"
path = "tests/scalar_locals/scalar_locals.rs"
required-features = ["std"]

[[test]]
name = "backend_parity"
path = "tests/backend_parity/backend_parity.rs"
required-features = ["std"]

[[test]]
name = "backend_tensor_parity"
path = "tests/backend_tensor_parity/backend_tensor_parity.rs"
required-features = ["std", "tensor"]

[[test]]
name = "mlx_checked_source"
path = "tests/mlx_checked_source/mlx_checked_source.rs"
required-features = ["mlx"]
