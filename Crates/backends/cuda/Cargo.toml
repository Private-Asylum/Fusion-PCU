[package]
name = "fusion-pcu-cuda"
description = "CUDA compute backend for Fusion PCU on NVIDIA GPUs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "cuda.rs"

[features]
default = []
allocation-census = []
insights = ["fusion-pcu-core/insights"]
tensor = ["fusion-pcu-core/tensor", "pcu-facade/tensor"]

[dependencies]
fusion-pcu-core.workspace = true
libloading.workspace = true
smallvec.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
pcu-facade = { workspace = true, features = ["cuda", "cpu"] }

