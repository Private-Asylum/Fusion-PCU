[package]
name = "fusion-pcu-vulkan"
description = "Limited synchronous Vulkan SPIR-V prototype for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "vulkan.rs"

[features]
default = []
hosted = ["dep:ash", "dep:fusion-pcu-spirv"]

[dependencies]
fusion-pcu-core.workspace = true
fusion-pcu-spirv = { workspace = true, optional = true }
ash = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
fusion-pcu-macros.workspace = true
winit.workspace = true

[[example]]
name = "compute-copy"
path = "examples/compute_copy/compute_copy.rs"
required-features = ["hosted"]
