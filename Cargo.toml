[workspace]
resolver = "3"
members = [
    "Crates/core",
    "Crates/fusion-pcu",
    "Crates/macros",
    "Crates/backends/rocm",
    "Crates/backends/cuda",
    "Crates/backends/mlx",
    "Crates/backends/cpu",
    "Crates/backends/spirv",
    "Crates/backends/vulkan",
    "Crates/backends/metal",
    "Crates/backends/dx12",
    "Crates/backends/opencl",
    "Crates/backends/ilz",
    "Crates/backends/wgpu",
    "Crates/backends/opengl",
]

[workspace.package]
version = "0.0.5"
edition = "2024"
authors = ["Private Asylum LLC"]
license = "Apache-2.0"
repository = "https://github.com/Private-Asylum/Fusion-PCU"
homepage = "https://github.com/Private-Asylum/Fusion-PCU"
readme = "README.md"
keywords = ["compute", "gpu", "ir", "coprocessor", "heterogeneous"]
categories = ["hardware-support", "science", "development-tools"]
publish = ["crates-io"]

[workspace.dependencies]
fusion-pcu-core = { version = "0.0.5", path = "Crates/core", default-features = false }
fusion-pcu = { version = "0.0.5", path = "Crates/fusion-pcu", default-features = false }
# In-tree development aliases omit versions to avoid test-only publish cycles.
# Dev links that retain a production dependency's crate name use local path-only
# entries: workspace inheritance cannot replace the production version policy.
pcu-facade = { package = "fusion-pcu", path = "Crates/fusion-pcu", default-features = false }
fusion-pcu-cpu = { version = "0.0.5", path = "Crates/backends/cpu", default-features = false }
pcu_alias = { package = "fusion-pcu", path = "Crates/fusion-pcu", default-features = false }
fusion-pcu-macros = { version = "0.0.5", path = "Crates/macros" }
fusion-pcu-rocm = { version = "0.0.5", path = "Crates/backends/rocm", default-features = false }
fusion-pcu-cuda = { version = "0.0.5", path = "Crates/backends/cuda", default-features = false }
fusion-pcu-mlx = { version = "0.0.5", path = "Crates/backends/mlx", default-features = false }
fusion-pcu-spirv = { version = "0.0.5", path = "Crates/backends/spirv", default-features = false }
fusion-pcu-vulkan = { version = "0.0.5", path = "Crates/backends/vulkan", default-features = false }
fusion-pcu-metal = { version = "0.0.5", path = "Crates/backends/metal", default-features = false }
fusion-pcu-dx12 = { version = "0.0.5", path = "Crates/backends/dx12", default-features = false }
fusion-pcu-opencl = { version = "0.0.5", path = "Crates/backends/opencl", default-features = false }
fusion-pcu-ilz = { version = "0.0.5", path = "Crates/backends/ilz", default-features = false }
fusion-pcu-wgpu = { version = "0.0.5", path = "Crates/backends/wgpu", default-features = false }
fusion-pcu-opengl = { version = "0.0.5", path = "Crates/backends/opengl", default-features = false }

ash = { version = "0.38.0", default-features = false, features = ["loaded"] }
proc-macro2 = "1.0.103"
quote = "1.0.41"
syn = { version = "2.0.108", features = ["full"] }
smallvec = "1"
libloading = "0.8"
libc = "0.2"
criterion = "0.7"
bytemuck = "1.25"
trybuild = "1.0"
winit = "0.30"

[workspace.dependencies.objc2]
version = "=0.6.4"
default-features = false
features = ["std"]

[workspace.dependencies.objc2-foundation]
version = "=0.3.2"
default-features = false
features = [
    "std",
    "NSString",
    "NSError",
    "NSObject",
    "NSArray",
]

[workspace.dependencies.objc2-metal]
version = "=0.3.2"
default-features = false
features = [
    "std",
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLTypes",
    "MTLAllocation",
]

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[profile.bench]
debug = 2
