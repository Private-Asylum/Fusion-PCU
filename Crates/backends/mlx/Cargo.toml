[package]
name = "fusion-pcu-mlx"
description = "Explicit MLX-owned checked dispatch and delegated GPU tensors for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
build = "ffi/rust/build/build.rs"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "mlx.rs"

[features]
default = []
tensor = ["fusion-pcu-core/tensor"]
benchmark-control = ["tensor"]
# Caller-thread view API attempts only; ordinary benchmark controls have no counter work.
view-census = ["benchmark-control"]
# No adapter counter work is compiled into ordinary benchmark controls.
division-census = ["benchmark-control"]
# Untimed carrier adapter attempts; no counter work in ordinary controls.
carrier-census = ["benchmark-control", "allocation-census"]
binary-census = ["benchmark-control", "allocation-census"]
integer-census = ["benchmark-control", "allocation-census"]
allocation-census = []
# Requested-header joint Portable source controls; no instrumentation in ordinary controls.
portable-joint-control = ["benchmark-control"]
portable-unary-control = ["benchmark-control"]

[dependencies]
fusion-pcu-core.workspace = true
libloading.workspace = true

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
sha2.workspace = true
pcu-facade = { workspace = true, features = ["std", "tensor", "mlx"] }
criterion.workspace = true

[[test]]
name = "checked_unary"
path = "tests/checked_unary/checked_unary.rs"

[[test]]
name = "native_prepare"
path = "tests/native_prepare/native_prepare.rs"

[[test]]
name = "source_capture"
path = "tests/source_capture/source_capture.rs"
required-features = ["tensor"]

[[bench]]
name = "compiled_matmul"
path = "benches/compiled_matmul/compiled_matmul.rs"
harness = false
required-features = ["benchmark-control"]

[[example]]
name = "prepared_matmul"
