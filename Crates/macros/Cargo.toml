[package]
name = "fusion-pcu-macros"
description = "Bounded Rust kernel frontend for Fusion PCU dispatch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true
path = "fusion-pcu-macros.rs"

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
pcu_alias = { package = "fusion-pcu", version = "0.1.0", path = "../fusion-pcu", default-features = false }
fusion-pcu-rocm = { version = "0.1.0", path = "../backends/rocm" }
fusion-pcu-cpu = { version = "0.1.0", path = "../backends/cpu" }
fusion-pcu-spirv = { version = "0.1.0", path = "../backends/spirv" }
trybuild = "1.0"

[lints]
workspace = true
