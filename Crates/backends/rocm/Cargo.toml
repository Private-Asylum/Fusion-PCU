[package]
name = "fusion-pcu-rocm"
description = "ROCm compute backend for Fusion PCU on AMD GPUs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
autoexamples = false
autobenches = false
autotests = false

[lib]
crate-type = ["rlib"]
path = "rocm.rs"

[features]
default = []
allocation-census = []
insights = ["fusion-pcu-core/insights", "pcu-facade/insights"]
tensor = ["fusion-pcu-core/tensor", "pcu-facade/tensor"]

[dependencies]
fusion-pcu-core.workspace = true
libloading.workspace = true
smallvec.workspace = true

[lints]
workspace = true

[dev-dependencies]
pcu-facade = { workspace = true, features = ["rocm"] }
# Test-only path dependencies stay out of the published dependency graph.
fusion-pcu-macros = { path = "../../macros" }
libloading.workspace = true
libc.workspace = true
bytemuck.workspace = true
criterion.workspace = true

[[example]]
name = "fusion-rocm-smoke"
path = "examples/smoke/smoke.rs"
test = true

[[example]]
name = "fusion-rocm-pcu"
path = "examples/dispatch/dispatch.rs"
test = true

[[example]]
name = "fusion-rocm-discover"
path = "examples/discovery/discovery.rs"
test = true

[[example]]
name = "fusion-rocm-tensor"
path = "examples/tensor/tensor.rs"
test = true
required-features = ["tensor"]

[[example]]
name = "fusion-rocm-rtc"
path = "examples/rtc/rtc.rs"
test = true

[[example]]
name = "fusion-rocm-train-step"
path = "examples/train-step/train-step.rs"
test = true
required-features = ["tensor"]

[[example]]
name = "fusion-rocm-fma-witness"
path = "examples/fma-witness/fma-witness.rs"
test = true

[[example]]
name = "fusion-rocm-typed-kernel"
path = "examples/typed-kernel/typed-kernel.rs"
test = true

