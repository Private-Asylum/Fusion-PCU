[package]
name = "fusion-pcu-mlx"
description = "Explicit delegated MLX GPU tensor runtime for Fusion PCU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
build = "ffi/rust/build/build.rs"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
path = "mlx.rs"

[features]
default = []
tensor = ["fusion-pcu-core/tensor"]
benchmark-control = ["tensor"]
allocation-census = []

[dependencies]
fusion-pcu-core.workspace = true
libloading.workspace = true

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
sha2.workspace = true
pcu-facade = { workspace = true, features = ["tensor"] }
criterion.workspace = true

[[test]]
name = "native_prepare"
path = "tests/native_prepare/native_prepare.rs"

[[test]]
name = "source_capture"
path = "tests/source_capture/source_capture.rs"
required-features = ["tensor"]

[[bench]]
name = "compiled_matmul"
path = "benches/compiled_matmul/compiled_matmul.rs"
harness = false
required-features = ["benchmark-control"]

[[example]]
name = "prepared_matmul"
path = "examples/prepared_matmul/prepared_matmul.rs"
required-features = ["tensor"]

[lints]
workspace = true
