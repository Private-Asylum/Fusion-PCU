[package]
name = "fusion-pcu-rocm"
description = "HIP runtime substrate for Fusion PCU on AMD GPUs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]
path = "rocm.rs"

[features]
default = []
tensor = ["dep:fusion-pcu-tensor"]

[dependencies]
fusion-pcu.workspace = true
fusion-pcu-tensor = { workspace = true, optional = true }
libloading = "0.8"
smallvec.workspace = true

[lints]
workspace = true
