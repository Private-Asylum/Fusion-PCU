[features]
default = []
allocation-census = []
insights = ["fusion-pcu/insights", "fusion-pcu-rocm/insights"]

[dependencies]
fusion-pcu = { workspace = true, features = ["tensor", "rocm"] }
fusion-pcu-rocm = { workspace = true, features = ["tensor"] }
fusion-pcu-macros.workspace = true

[dev-dependencies]
libloading.workspace = true
libc.workspace = true
bytemuck = "1.25"
criterion.workspace = true

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[lints.rust]
unsafe_code = "deny"

