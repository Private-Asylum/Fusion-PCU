[package]
name = "fusion-pcu-example-cuda"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "fusion-cuda-example"
path = "main.rs"

[[bench]]
name = "source_facade"
path = "benches/source_facade.rs"
harness = false

[features]
default = []
allocation-census = []

[dependencies]
fusion-pcu = { workspace = true, features = ["cuda", "tensor"] }
fusion-pcu-cuda = { workspace = true, features = ["tensor"] }

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "strict_matmul"
path = "benches/strict_matmul/strict_matmul.rs"
harness = false
